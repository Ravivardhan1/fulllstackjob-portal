services:
  - type: web
    name: job-portal-api
    env: node
    plan: free
    rootDir: full-stack-job-portal-server-main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_STRING
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: COOKIE_NAME
        value: job_portal_token
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_SERVER_URL
        sync: false

  - type: web
    name: job-portal-web
    runtime: static
    rootDir: full-stack-job-portal-client-main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
